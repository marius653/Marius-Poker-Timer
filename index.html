<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <title>Poker Timer</title>
    <style>
        :root { --setup-scale: 1.2; --chips-scale: 3; --pot-scale: 1.0; }
        body { background-image: linear-gradient(rgba(0,0,0,0.8), rgba(0,0,0,0.8)), url('bakgrunn.png'); background-size: cover; background-position: center center; background-attachment: fixed; color: white; font-family: 'Segoe UI', sans-serif; margin: 0; overflow: auto; }
        .hidden { display: none !important; }
        #setup-screen { width: 1100px; margin: 30px auto; background: #222; padding: 60px; border-radius: 15px; text-align: center; transform: scale(var(--setup-scale)); transform-origin: top center; }
        #setup-screen h2 { margin: 0 0 12px 0; }
        .setup-grid { display: flex; gap: 25px; justify-content: center; align-items: flex-start; }
        .setup-box { flex: 1; width: 500px; background: #222; padding: 20px; border-radius: 12px; display: flex; flex-direction: column; align-items: center; }
        .setup-box h3 { text-align: center; margin: 0 0 10px 0; }
        .box-title { width: 100%; text-align: center; font-size: 20px; font-weight: bold; color: #ffcc00; margin-bottom: 10px; }
        .box-subtitle { text-align: center; font-size: 12px; color: #aaa; margin-bottom: 10px; }
        #levels-table { width: 100%; text-align: center; }
        .start-wrapper { width: 100%; display: flex; justify-content: center; margin-top: 60px; }   
        .start-wrapper button { width: 320px; padding: 18px; font-size: 22px; font-weight: bold; background: #2e7d32; color: white; border: none; border-radius: 10px; cursor: pointer; }
        .player-input-row { display: flex; align-items: center; justify-content: space-between; margin-top: 25px; margin-bottom: 8px; background: #333; padding: 10px; border-radius: 5px; }
        .pos-label { font-size: 11px; color: #ffcc00; font-weight: bold; width: 120px; text-align: left; text-transform: uppercase; }
        .name-in { flex-grow: 1; background: #1a1a1a; border: 1px solid #444; color: white; padding: 8px; border-radius: 4px; }
        @media (max-width: 900px) { .setup-grid { flex-direction: column; } #setup-screen { width: 95%; } }
        #timer-screen { width: 100vw; height: 100vh; display: grid; grid-template-columns: 1fr 2fr 1fr; grid-template-rows: 2.5fr 0.6fr 0.4fr 0.7fr; align-items: center; padding: 20px; box-sizing: border-box; }
        .center-wrap { position: relative; display: flex; align-items: center; justify-content: center; width: 34vw; height: 34vw; margin: 0 auto; }
        .root{ --circle-scale: 1.1; }
        #svg-container { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 1;transform: scale(var(--circle-scale));transform-origin: center; }
        #timer { position: relative; z-index: 2; font-size: 9vw; font-weight: bold; font-family: monospace; text-align: center; line-height: 1; }
        .tit { font-size: 1.5vw; color: #888; text-transform: uppercase; text-align: center; }
        .val { font-size: 5vw; font-weight: bold; text-align: center; }
        .top-left-controls { position: absolute; top: 25px; left: 25px; display: flex; gap: 10px; z-index: 500; }
        .top-right-controls { position: absolute; top: 25px; right: 25px; display: flex; gap: 15px; z-index: 500; }
        .btn-small { padding: 10px 20px; font-size: 14px; background: #444; color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; }
        #main-pot-display { grid-column: span 3; text-align: center; font-size: calc(4vw * var(--pot-scale)); font-weight: bold; color: #ffcc00; cursor: ns-resize; position: relative; z-index: 1; margin-top: -230px; }
        .chips-image { grid-column: span 3; width: calc(320px * var(--chips-scale)); max-width: 80vw; display: block; margin: 0 auto; cursor: ns-resize; position: relative; z-index: 1; }
        .chips-row { grid-column: span 3; display: flex; justify-content: center; gap: calc(25px * var(--chips-scale)); cursor: ns-resize; position: relative; z-index: 1; margin-top: -150px; }
        .chip { width: calc(60px * var(--chips-scale)); height: calc(60px * var(--chips-scale)); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: calc(14px * var(--chips-scale)); font-weight: bold; border: 2px dashed rgba(255,255,255,0.2); pointer-events: none; }
        .c10 { background: #eee; color: #111; } .c20 { background: #a00; color: #fff; } .c50 { background: #060; color: #fff; } .c100 { background: #006; color: #fff; } .c500 { background: #111; color: #fff; border-color: #444; }
        .stacks-container { grid-column: span 3; display: flex; justify-content: space-around; background: rgba(0,0,0,0.5); padding: 15px; border-radius: 12px; border: 1px solid #333; align-self: end; margin-bottom: 100px; position: relative; z-index: 1; }
        .player-stack { text-align: center; position: relative; min-width: 140px; }
        .pos-tag { font-size: 14px; background: #ffcc00; color: black; padding: 2px 7px; border-radius: 3px; font-weight: bold; position: absolute; top: -20px; left: 50%; transform: translateX(-50%); text-transform: uppercase; white-space: nowrap; }
        .pos-tag.dealer-color { background: #2e7d32; color: white; }
        .p-name-main { font-size: 1.4vw; color: #fff; margin-bottom: 2px; font-weight: 500; }
        .p-amt { font-size: 2.5vw; color: #ffcc00; font-weight: bold; }
        .btn-blue { background: #1565c0; color: white; border: none; padding: 15px 30px; border-radius: 8px; cursor: pointer; font-size: 18px; font-weight: bold; }
        .btn-gray { background: #303030; color: white; border: none; padding: 15px 30px; border-radius: 8px; cursor: pointer; font-size: 18px; font-weight: bold; }
        .stack-edit-wrapper { grid-column: span 3; display: flex; justify-content: center; margin-top: 10px; position: relative; z-index: 5; }
        #stack-modal { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.85); display: flex; justify-content: center; align-items: center; z-index: 9999; }
        .modal-content { background: #222; padding: 25px; border-radius: 12px; width: 400px; text-align: center; }
        #stack-edit-list input { width: 100%; margin: 5px 0; padding: 8px; background: #111; color: white; border: 1px solid #444; border-radius: 5px; }
        .busted { filter: grayscale(100%) }
        .busted .p-amt { color: #999 !important; }
        .busted .pos-tag { background: #555 !important; color: #ccc !important; }
    </style>
</head>
<body>
    <div id="setup-screen">
        <h2 style="color:#ffcc00">Poker Setup</h2>
        <div class="setup-grid">
            <div class="setup-box">
                <div class="box-title">Spillere & Stack</div>
                <div id="player-inputs"></div>
                <div style="margin-top: 20px;">
                    Start Stack:
                    <input type="number" id="start-stack-input" value="2500">
                </div>
            </div>
            <div class="setup-box">
                <div class="box-title">Blind Levels</div>
                <div class="box-subtitle">Minutter og Big Blind</div>
                <table id="levels-table">
                    <tbody></tbody>
                </table>
            </div>
        </div>
        <div class="start-wrapper">
            <button onclick="startApp()">START SPILL</button>
        </div>
    </div>

    <div id="timer-screen" class="hidden">
        <div class="top-left-controls">
            <button class="btn-small" onclick="manualLevelChange(-1)">◄ Level</button>
            <button class="btn-small" onclick="manualLevelChange(1)">Level ►</button>
        </div>
        <div class="top-right-controls">
            <button class="btn-blue" onclick="openExternalWizard()">ÅPNE RUNDEVINDU</button>
            <button id="startBtn" class="btn-blue" style="background:#2e7d32" onclick="toggleTimer()">START</button>
            <button class="btn-blue" style="background:#444" onclick="location.reload()">AVSLUTT</button>
        </div>
        <div class="side"><div class="tit">Nåværende</div><div id="cur-val" class="val">--</div></div>
        <div class="center-wrap"><svg id="svg-container" viewBox="0 0 200 200"></svg><div id="timer">00:00</div></div>
        <div class="side" style="opacity:0.3"><div class="tit">Neste</div><div id="next-val" class="val">--</div></div>
        <div id="main-pot-display" onmousedown="handleDragStart(event, this)">POT: 0</div>
        <div class="chips-row" onmousedown="handleDragStart(event, this)">
            <img src="chips.png" class="chips-image" />
            <!-- <div class="chip c10">10</div><div class="chip c20">20</div><div class="chip c50">50</div><div class="chip c100">100</div><div class="chip c500">500</div> -->
        </div>
        <div class="stacks-container" id="stacks-display" onmousedown="handleDragStart(event, this)"></div>
        <div class="stack-edit-wrapper">
            <button class="btn-gray" onclick="openStackEditor()">Endre stacks</button>
        </div>
    </div>

    <div id="stack-modal" class="hidden">
        <div class="modal-content">
            <h2>Endre stacks</h2>
            <div id="stack-edit-list"></div>
            <button class="btn-blue" onclick="saveStacks()">Lagre</button>
            <button class="btn-small" onclick="closeStackEditor()">Lukk</button>
        </div>
    </div>

    <script>
        var tournamentLevels = [
            { lvl: 1, min: 30, bb: 20, sb: 10 }, { lvl: 2, min: 30, bb: 40, sb: 20 },
            { lvl: 3, min: 30, bb: 60, sb: 30 }, { lvl: 4, min: 30, bb: 80, sb: 40 },
            { lvl: 5, min: 20, bb: 100, sb: 50 }, { lvl: 6, min: 20, bb: 120, sb: 60 },
            { lvl: 7, min: 20, bb: 140, sb: 70 }, { lvl: 8, min: 20, bb: 160, sb: 80 },
            { lvl: 9, min: 15, bb: 200, sb: 100 }, { lvl: 10, min: 15, bb: 300, sb: 150 },
            { lvl: 11, min: 15, bb: 400, sb: 200 }, { lvl: 12, min: 15, bb: 500, sb: 250 },
            { lvl: 13, min: 10, bb: 600, sb: 300 }, { lvl: 14, min: 10, bb: 800, sb: 400 },
            { lvl: 15, min: 10, bb: 1000, sb: 500 }, { lvl: 16, min: 10, bb: 1400, sb: 700 }
        ];

        initLevelsTable();

        function initLevelsTable() {
            var tbody = document.querySelector("#levels-table tbody");
            tbody.innerHTML = "";

            tournamentLevels.forEach(function(lvl, i) {
                var row = document.createElement("tr");
                row.style.background = i % 2 ? "#2a2a2a" : "#1f1f1f";

                row.innerHTML = `
                    <td>${lvl.lvl}</td>
                    <td><input type="number" value="${lvl.min}" data-i="${i}" class="lvl-min" style="width:60px"></td>
                    <td><input type="number" value="${lvl.bb}" data-i="${i}" class="lvl-bb" style="width:80px"></td>
                    <td class="sb-cell">${lvl.sb}</td>
                `;

                tbody.appendChild(row);
            });
        }

        var positionSets = {
            full: {
                6: ["Dealer", "Small blind", "Big blind", "UTG", "Hijack", "Cutoff"],
                5: ["Dealer", "Small blind", "Big blind", "UTG", "Cutoff"],
                4: ["Dealer", "Small blind", "Big blind", "UTG"],
                3: ["Dealer", "Small blind", "Big blind"],
                2: ["Dealer/SB", "Big blind"],
                1: ["Vinner"]
            },
            short: {
                6: ["D", "SB", "BB", "UTG", "HJ", "CO"],
                5: ["D", "SB", "BB", "UTG", "CO"],
                4: ["D", "SB", "BB", "UTG"],
                3: ["D", "SB", "BB"],
                2: ["D/SB", "BB"],
                1: ["WIN"]
            }
        };
        
        var players = []; var dealerIndex = 3; var currentLvlIdx = 0; var timeLeft = 0; var timerId = null; var popupWindow = null;

        var dragEl = null; var startY = 0; var initialTop = 0;
        function handleDragStart(e, el) { dragEl = el; startY = e.clientY; initialTop = parseInt(window.getComputedStyle(el).top) || 0; document.onmousemove = handleDragMove; document.onmouseup = handleDragEnd; }
        function handleDragMove(e) { if (!dragEl) return; dragEl.style.top = (initialTop + (e.clientY - startY)) + "px"; }
        function handleDragEnd() { dragEl = null; document.onmousemove = null; document.onmouseup = null; }

        var inputCont = document.getElementById('player-inputs');
        for(var i=0; i<6; i++) {
            var label = ["Under the gun", "Hijack", "Cutoff", "Button", "Small blind", "Big blind"][i];
            inputCont.innerHTML += '<div class="player-input-row"><span class="pos-label">' + label + '</span><input type="text" id="name-' + i + '" class="name-in" value="Spiller ' + (i+1) + '"></div>';
        }
        
        function updateLevelsFromTable() {
            var mins = document.querySelectorAll(".lvl-min");
            var bbs = document.querySelectorAll(".lvl-bb");

            tournamentLevels = [];

            for (var i = 0; i < mins.length; i++) {
                var min = parseInt(mins[i].value) || 1;
                var bb = parseInt(bbs[i].value) || 1;

                tournamentLevels.push({
                    lvl: i + 1,
                    min: min,
                    bb: bb,
                    sb: Math.floor(bb / 2)
                });
            }
        }

        function getActiveSeatIndexes() {
            var arr = [];
            for (var i = 0; i < players.length; i++) {
                if ((players[i].stack || 0) > 0) arr.push(i);
            }
            return arr;
            }

            function isSeatActive(idx) {
            return players[idx] && (players[idx].stack || 0) > 0;
            }

            function getNextActiveSeat(fromIdx) {
            if (!players.length) return fromIdx;
            for (var step = 1; step <= players.length; step++) {
                var idx = (fromIdx + step) % players.length;
                if (isSeatActive(idx)) return idx;
            }
            return fromIdx;
            }

            function normalizeDealerIndex() {
            var active = getActiveSeatIndexes();
            if (!active.length) return;
            if (!isSeatActive(dealerIndex)) {
                dealerIndex = getNextActiveSeat(dealerIndex);
            }
            }

            function getOrderedActiveSeatsFromDealer() {
            normalizeDealerIndex();
            var ordered = [];
            for (var step = 0; step < players.length; step++) {
                var idx = (dealerIndex + step) % players.length;
                if (isSeatActive(idx)) ordered.push(idx);
            }
            return ordered;
            }

            function getPositionMap(mode) {
            var map = [];
            var activeSeats = getOrderedActiveSeatsFromDealer();
            var count = activeSeats.length;
            var labels = positionSets[mode][count] || [];

            for (var i = 0; i < players.length; i++) {
                map[i] = mode === "short" ? "OUT" : "Slått ut";
            }

            for (var j = 0; j < activeSeats.length; j++) {
                map[activeSeats[j]] = labels[j] || (mode === "short" ? "IN" : "I spill");
            }

            return map;
            }

        function startApp() {
            updateLevelsFromTable();
            var stack = parseInt(document.getElementById('start-stack-input').value) || 2500;
            players = [];
            for(var i=0; i<6; i++) { players.push({ name: document.getElementById('name-' + i).value, stack: stack }); }
            currentLvlIdx = 0; setupLevel(); updateStackDisplay(); initSVG();
            document.getElementById('setup-screen').classList.add('hidden');
            document.getElementById('timer-screen').classList.remove('hidden');
        }

        function setupLevel() {
            var data = tournamentLevels[currentLvlIdx];
            timeLeft = data.min * 60;
            document.getElementById('cur-val').innerText = data.sb + "/" + data.bb;
            var next = tournamentLevels[currentLvlIdx + 1];
            document.getElementById('next-val').innerText = next ? next.sb + "/" + next.bb : "--";
            updateDisplay();
            if(popupWindow && !popupWindow.closed) { popupWindow.updateBlinds(data.sb, data.bb); }
        }

        function manualLevelChange(dir) {
            var target = currentLvlIdx + dir;
            if (target >= 0 && target < tournamentLevels.length) {
                currentLvlIdx = target;
                setupLevel();
                if(timerId) new Audio('https://google.com').play();
            }
        }

        function updateStackDisplay() {
            normalizeDealerIndex();

            var posFullMap = getPositionMap("full");
            var posShortMap = getPositionMap("short");

            var html = "";
            for (var i = 0; i < players.length; i++) {
                var posName = posFullMap[i];
                var busted = players[i].stack <= 0;

                html += '<div class="player-stack ' + (busted ? 'busted' : '') + '">' +
                '<div class="pos-tag ' + ((posName === "Dealer" || posName === "Dealer/SB") ? "dealer-color" : "") + '">' + posName + '</div>' +
                '<div class="p-name-main">' + players[i].name + '</div>' +
                '<div class="p-amt">' + players[i].stack + '</div>' +
                '</div>';
            }

            document.getElementById('stacks-display').innerHTML = html;

            if (popupWindow && !popupWindow.closed) {
                var data = tournamentLevels[currentLvlIdx];
                var list = players.map(function(p, idx) {
                return {
                    name: p.name,
                    pos: posShortMap[idx],
                    stack: p.stack,
                    active: p.stack > 0
                };
                });
                popupWindow.updateData(list, data.sb, data.bb);
            }
        }

        function openExternalWizard() {
            if (popupWindow && !popupWindow.closed) { popupWindow.focus(); return; }
            popupWindow = window.open("", "PokerWizardV54", "width=1000,height=850,resizable=yes,scrollbars=yes");
            var data = tournamentLevels[currentLvlIdx];
            var posShortMap = getPositionMap("short");
            var pList = players.map(function(p, i) {
                return {
                    name: p.name,
                    pos: posShortMap[i],
                    stack: p.stack,
                    active: p.stack > 0
                };
            });

            var content = '<html><head><title>Runde</title><style>body{background:#1a1a1a;color:white;font-family:sans-serif;padding:20px;user-select:none;}.header{font-size:40px;color:#ffcc00;text-align:center;font-weight:bold;margin-bottom:20px;text-transform:uppercase;}.row{display:grid;grid-template-columns:220px 1fr 150px;align-items:center;gap:20px;background:#262626;padding:15px;margin-bottom:10px;border-radius:10px;}.chips{display:flex;gap:12px;justify-content:center;}.chip-wrap{position:relative;}.chip{width:65px;height:65px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:bold;border:3px dashed rgba(255,255,255,0.2);cursor:pointer;}.c10{background:#eee;color:#111;}.c20{background:#a00;color:#fff;}.c50{background:#060;color:#fff;}.c100{background:#006;color:#fff;}.c500{background:#111;color:#fff;border-color:#444;}.count{position:absolute;top:-10px;right:-5px;background:#ffcc00;color:#000;border-radius:50%;width:24px;height:24px;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:bold;border:2px solid:#1a1a1a;}.val{font-size:32px;font-weight:bold;color:#ffcc00;text-align:right;}.nav{display:flex;justify-content:space-between;align-items:center;margin-top:30px;}button{padding:18px 40px;border-radius:10px;border:none;cursor:pointer;font-weight:bold;font-size:20px;color:white;}</style></head><body><div id="ui"></div><script>' +
            'var state = []; var stepIdx = 0; var curSB = 0; var curBB = 0; var chipVals = [10, 20, 50, 100, 500];' +
            'window.updateBlinds = function(sb, bb) { curSB = sb; curBB = bb; if(stepIdx === 0) resetRound(); };' +
            'window.updateData = function(list, sb, bb) { curSB = sb; curBB = bb; state = list.map(function(p){ return {name:p.name, pos:p.pos, stack:p.stack || 0, active: !!p.active, roundBet:0, stepBet:0, isWinner:false, stepChips:{10:0,20:0,50:0,100:0,500:0}}; }); resetRound(); };' +
            'function resetRound() { stepIdx = 0; state.forEach(function(p){ p.roundBet = 0; p.stepBet = 0; p.isWinner = false; p.stepChips = {10:0,20:0,50:0,100:0,500:0}; if(!p.active) return; if(p.pos==="SB" || p.pos==="D/SB"){ p.roundBet=Math.min(curSB,p.stack); p.stepBet=Math.min(curSB,p.stack); p.stepChips[curSB]=(p.stepChips[curSB]||0)+1; } if(p.pos==="BB"){ p.roundBet=Math.min(curBB,p.stack); p.stepBet=Math.min(curBB,p.stack); p.stepChips[curBB]=(p.stepChips[curBB]||0)+1; } }); render(); }' +
            'function assign(p, val) { }' +
            'window.doAdd = function(i, v) { var p = state[i]; if(!p.active) return; var remaining = p.stack - p.roundBet; if (remaining <= 0) return; var addAmount = Math.min(v, remaining); p.stepBet += addAmount; p.roundBet += addAmount; p.stepChips[v]++; render(); };' +                
            'window.doRem = function(e, i, v) { e.preventDefault(); if(state[i].stepChips[v]>0){ state[i].stepBet -= v; state[i].roundBet -= v; state[i].stepChips[v]--; render(); } return false; };' +
            'window.doStep = function(dir) { if(stepIdx === 4 && dir === 1) { window.opener.finalizeRound(state); resetRound(); return; } if(stepIdx === 0 && dir === -1) return; stepIdx += dir; state.forEach(function(p){ p.stepBet = 0; p.stepChips = {10:0,20:0,50:0,100:0,500:0}; }); render(); };' +
            'function render() { var pot = 0; state.forEach(function(p){ pot += p.roundBet; }); if(window.opener) window.opener.updatePotRealtime(pot); var h = "<div class=\'header\'>" + ["PREFLOP", "FLOP", "TURN", "RIVER", "VELG VINNER"][stepIdx] + "</div>";' +
            'state.forEach(function(p, i) { if(stepIdx < 4) { if(!p.active){ h += "<div class=\'row\' style=\'opacity:0.4\'><div><b style=\'color:#999\'>[Slått ut]</b> "+p.name+"</div><div></div><div class=\'val\' style=\'color:#999\'>0</div></div>"; } else { h += "<div class=\'row\'><div><b style=\'color:#ffcc00\'>["+p.pos+"]</b> "+p.name+"</div><div class=\'chips\'>"; chipVals.forEach(function(v) { h += "<div class=\'chip-wrap\'>" + (p.stepChips[v]>0 ? "<div class=\'count\'>"+p.stepChips[v]+"</div>" : "") + "<div class=\'chip c"+v+"\' onclick=\'doAdd("+i+","+v+")\' oncontextmenu=\'return doRem(event,"+i+","+v+")\'>"+v+"</div></div>"; }); h += "</div><div class=\'val\'>"+p.stepBet+"</div></div>"; } }' +
            'else { if(!p.active){ h += "<div class=\'row\' style=\'opacity:0.4\'><div><b style=\'font-size:24px\'>"+p.name+"</b></div><div></div><div style=\'text-align:right;color:#999\'>SLÅTT UT</div></div>"; } else { h += "<div class=\'row\'><div><b style=\'font-size:24px\'>"+p.name+"</b></div><div></div><div style=\'text-align:right\'>VINNER? <input type=\'checkbox\' style=\'width:35px;height:35px\' "+(p.isWinner?"checked":"")+" onchange=\'state["+i+"].isWinner=this.checked\'></div></div>"; } } });' +
            'h += "<div class=\'nav\'><button style=\'background:#444\' onclick=\'doStep(-1)\'>TILBAKE</button><div style=\'font-size:45px; font-weight:bold; color:#ffcc00\'>POTT: "+pot+"</div><button style=\'background:"+(stepIdx<4?"#1565c0":"#c62828")+"\' onclick=\'doStep(1)\'>"+(stepIdx<4?"NESTE":"AVSLUTT")+"</button></div>"; document.getElementById("ui").innerHTML = h; }' +
            'window.updateData(' + JSON.stringify(pList) + ',' + data.sb + ',' + data.bb + ');' +
            '<\/script></body></html>';
            popupWindow.document.write(content);
            popupWindow.document.close();
        }

        window.updatePotRealtime = function(val) { document.getElementById("main-pot-display").innerText = "POT: " + val; };
        
        window.finalizeRound = function(st) {
            // Trekk hver spillers bidrag fra stacken
            players.forEach(function(p, i) {
                p.stack -= (st[i].roundBet || 0);
            });

            // Lag liste over spillere som faktisk har bidratt til potten
            var involved = st
                .map(function(p, i) {
                return {
                    index: i,
                    name: p.name,
                    roundBet: p.roundBet || 0,
                    isWinner: !!p.isWinner
                };
                })
                .filter(function(p) {
                return p.roundBet > 0;
                })
                .sort(function(a, b) {
                return a.roundBet - b.roundBet;
                });

            // Hvis ingen har lagt noe i potten
            if (!involved.length) {
                normalizeDealerIndex();
                dealerIndex = getNextActiveSeat(dealerIndex);
                normalizeDealerIndex();
                updateStackDisplay();
                document.getElementById("main-pot-display").innerText = "POT: 0";

                if (popupWindow && !popupWindow.closed) {
                var dataEmpty = tournamentLevels[currentLvlIdx];
                var posShortMapEmpty = getPositionMap("short");
                var listEmpty = players.map(function(p, idx) {
                    return {
                    name: p.name,
                    pos: posShortMapEmpty[idx],
                    stack: p.stack,
                    active: p.stack > 0
                    };
                });
                popupWindow.updateData(listEmpty, dataEmpty.sb, dataEmpty.bb);
                }
                return;
            }

            // Bygg main pot + sidepots
            var pots = [];
            var prevLevel = 0;

            for (var i = 0; i < involved.length; i++) {
                var level = involved[i].roundBet;

                var contributors = involved.filter(function(p) {
                return p.roundBet >= level;
                });

                var slice = level - prevLevel;
                var potSize = slice * contributors.length;

                if (potSize > 0) {
                pots.push({
                    size: potSize,
                    eligible: contributors.map(function(p) {
                    return p.index;
                    })
                });
                }

                prevLevel = level;
            }

            // Fordel hver pot til markerte vinnere som faktisk er eligible
            pots.forEach(function(pot) {
                var potWinners = st
                .map(function(p, i) {
                    return {
                    index: i,
                    isWinner: !!p.isWinner
                    };
                })
                .filter(function(p) {
                    return p.isWinner && pot.eligible.indexOf(p.index) !== -1;
                });

                if (!potWinners.length) return;

                var share = Math.floor(pot.size / potWinners.length);
                var remainder = pot.size % potWinners.length;

                potWinners.forEach(function(w, idx) {
                players[w.index].stack += share + (idx < remainder ? 1 : 0);
                });
            });

            // Flytt dealer til neste aktive spiller
            normalizeDealerIndex();
            dealerIndex = getNextActiveSeat(dealerIndex);
            normalizeDealerIndex();

            // Oppdater visning
            updateStackDisplay();
            document.getElementById("main-pot-display").innerText = "POT: 0";

            if (popupWindow && !popupWindow.closed) {
                var data = tournamentLevels[currentLvlIdx];
                var posShortMap = getPositionMap("short");
                var list = players.map(function(p, idx) {
                return {
                    name: p.name,
                    pos: posShortMap[idx],
                    stack: p.stack,
                    active: p.stack > 0
                };
                });
                popupWindow.updateData(list, data.sb, data.bb);
            }
        };

        function initSVG() {
            var svg = document.getElementById("svg-container");
            svg.innerHTML = "";

            var segments = 80;

            var SCALE = 1.0; // 🔥 juster denne

            var baseRadius = 80;
            var baseWidth = 2.2;
            var baseHeight = 10;

            var radius = baseRadius * SCALE;
            var rectWidth = baseWidth * SCALE;
            var rectHeight = baseHeight * SCALE;

            for (var i = 0; i < segments; i++) {
                var angleDeg = i * (360 / segments);
                var angleRad = (angleDeg - 90) * Math.PI / 180;

                var x = 100 + radius * Math.cos(angleRad);
                var y = 100 + radius * Math.sin(angleRad);

                var rect = document.createElementNS("http://www.w3.org/2000/svg", "rect");

                rect.setAttribute("x", x - rectWidth / 2);
                rect.setAttribute("y", y - rectHeight / 2);
                rect.setAttribute("width", rectWidth);
                rect.setAttribute("height", rectHeight);
                rect.setAttribute("rx", rectWidth / 2);
                rect.setAttribute("fill", "#2a2a2a");
                rect.setAttribute("transform", "rotate(" + angleDeg + "," + x + "," + y + ")");
                rect.setAttribute("id", "r-" + i);

                svg.appendChild(rect);
            }
        }
        function updateDisplay() {
            var m = Math.floor(timeLeft / 60);
            var s = timeLeft % 60;

            document.getElementById("timer").innerText =
                (m < 10 ? "0" + m : m) + ":" + (s < 10 ? "0" + s : s);

            var total = tournamentLevels[currentLvlIdx].min * 60;
            var filled = Math.floor(((total - timeLeft) / total) * 80);

            for (var i = 0; i < 80; i++) {
                var el = document.getElementById("r-" + i);
                if (el) {
                el.setAttribute("fill", i < filled ? "#8b0000" : "#2a2a2a");
                }
            }
        }
        function toggleTimer() {
            var b = document.getElementById("startBtn");
            if (timerId) { clearInterval(timerId); timerId = null; b.innerText = "START"; }
            else { b.innerText = "PAUSE"; timerId = setInterval(function() { if (timeLeft > 0) { timeLeft--; updateDisplay(); } else { currentLvlIdx++; if(currentLvlIdx < tournamentLevels.length) { setupLevel(); new Audio("https://google.com").play(); } } }, 1000); }
        }

        function openStackEditor() {
            var html = "";
            for (var i = 0; i < players.length; i++) {
                html += '<div><div style="color:#ffcc00; margin-top:10px;">' + players[i].name + '</div>';
                html += '<input type="number" id="stack-' + i + '" value="' + players[i].stack + '"></div>';
            }
            document.getElementById("stack-edit-list").innerHTML = html;
            document.getElementById("stack-modal").classList.remove("hidden");
        }

         function closeStackEditor() {
            document.getElementById("stack-modal").classList.add("hidden");
        }   

        function saveStacks() {
            for (var i = 0; i < players.length; i++) {
                var val = parseInt(document.getElementById("stack-" + i).value) || 0;
                players[i].stack = val;
            }
            normalizeDealerIndex();
            updateStackDisplay();
            closeStackEditor();
        }

        document.addEventListener("input", function(e) {
            if (e.target.classList.contains("lvl-bb")) {
                var bb = parseInt(e.target.value) || 0;
                var row = e.target.closest("tr");
                row.querySelector(".sb-cell").innerText = Math.floor(bb / 2);
            }
        });

    </script>
